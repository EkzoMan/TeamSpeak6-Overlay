# Сборка сайта не требуется — статический сайт публикуется как есть.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только одну одновременную публикацию.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Публикуем содержимое папки website/
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
